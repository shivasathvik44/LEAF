name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # API 37's SDK package includes the minor version in its name.
  LEAF_ANDROID_PACKAGES: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.LEAF_ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, and lint
        run: ./gradlew --no-daemon --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.LEAF_ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pre-build test APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 35
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 2048M
          heap-size: 512M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            for _ in $(seq 1 30); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 2
            done
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell input keyevent 82 || true
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell settings put secure anr_show_background 0 || true
            adb shell dumpsys window policy 2>/dev/null | grep -E 'mShowingLockscreen|isStatusBarKeyguard|screenState' | head -n 5 || true
            set -e

            PROGRESS_PID=""
            cleanup_progress() {
              if [ -n "$PROGRESS_PID" ]; then
                kill "$PROGRESS_PID" 2>/dev/null || true
                wait "$PROGRESS_PID" 2>/dev/null || true
                PROGRESS_PID=""
              fi
            }
            trap cleanup_progress EXIT

            (
              printed=0
              while true; do
                log_file=$(find app/build/outputs/androidTest-results -name 'test-results.log' 2>/dev/null | head -n 1 || true)
                if [ -n "$log_file" ] && [ -f "$log_file" ]; then
                  out=$(awk -F= '
                    /^INSTRUMENTATION_STATUS: test=/ { t=$2 }
                    /^INSTRUMENTATION_STATUS: class=/ { c=$2 }
                    /^INSTRUMENTATION_STATUS: current=/ { n=$2 }
                    /^INSTRUMENTATION_STATUS: numtests=/ { m=$2 }
                    /^INSTRUMENTATION_STATUS_CODE: / {
                      code=$0; sub(/^INSTRUMENTATION_STATUS_CODE: /, "", code)
                      gsub(/\r/, "", t); gsub(/\r/, "", c); gsub(/\r/, "", n); gsub(/\r/, "", m); gsub(/\r/, "", code)
                      if (code == "1") printf "[%s/%s] START %s#%s\n", n, m, c, t
                      else if (code == "0") printf "[%s/%s] PASS  %s#%s\n", n, m, c, t
                      else printf "[%s/%s] FAIL(%s) %s#%s\n", n, m, code, c, t
                    }
                  ' "$log_file" | tail -n +"$((printed + 1))")
                  if [ -n "$out" ]; then
                    printf '%s\n' "$out"
                    add=$(printf '%s\n' "$out" | wc -l)
                    printed=$((printed + add))
                  fi
                fi
                sleep 10
              done
            ) < /dev/null &
            PROGRESS_PID=$!

            status=0
            timeout -k 30s 22m ./gradlew --no-daemon --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.timeout_msec=180000 \
              :app:connectedDebugAndroidTest < /dev/null || status=$?

            cleanup_progress
            if [ "$status" -ne 0 ]; then
              echo "::error::connectedDebugAndroidTest failed or timed out with exit code $status"
              find app/build/outputs/androidTest-results -name 'test-results.log' -exec sh -c 'echo "=== Tail of $1 ==="; tail -n 80 "$1"' _ {} \; || true
              latest_logcat=$(find app/build/outputs/androidTest-results -name 'logcat-*.txt' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -n "$latest_logcat" ] && [ -f "$latest_logcat" ]; then
                echo "=== Tail of latest test logcat: $latest_logcat ==="
                tail -n 120 "$latest_logcat" || true
              fi
              echo "=== Focused window ==="
              timeout 15 adb shell dumpsys window windows 2>/dev/null | grep -E 'Window #|mCurrentFocus|mFocusedApp' || true
              echo "=== Top activity ==="
              timeout 15 adb shell dumpsys activity top 2>/dev/null | head -n 60 || true
              echo "=== Recent device logcat ==="
              timeout 15 adb logcat -d -t 150 || true
              exit "$status"
            fi

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
