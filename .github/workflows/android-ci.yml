name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Environment Diagnostics
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle Wrapper Version ==="
          ./gradlew --version
          echo "=== Android Environment ==="
          echo "ANDROID_HOME: ${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          echo "=== Initial SDK Manager Availability ==="
          command -v sdkmanager || echo "sdkmanager not found in initial PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate sdkmanager and install required packages
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            sudo mkdir -p "$SDK_ROOT"
            sudo chown -R "$USER:$USER" "$SDK_ROOT"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "setup-android did not provide sdkmanager; downloading verified official Android SDK command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            TMP_DIR="$(mktemp -d)"
            CMDLINE_VERSION="15859902"
            CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            EXPECTED_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
            curl -sSL "$CMDLINE_URL" -o "$TMP_DIR/cmdline-tools.zip"
            echo "${EXPECTED_SHA256}  $TMP_DIR/cmdline-tools.zip" | sha256sum -c -
            unzip -q -o "$TMP_DIR/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$TMP_DIR"
            if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            fi
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager already available from setup-android at: $SDKMANAGER"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools are missing"
            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --version
          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Validate Android SDK installation
        run: |
          sdkmanager --version
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Environment Diagnostics
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle Wrapper Version ==="
          ./gradlew --version
          echo "=== Android Environment ==="
          echo "ANDROID_HOME: ${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          echo "=== Initial SDK Manager Availability ==="
          command -v sdkmanager || echo "sdkmanager not found in initial PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate sdkmanager and install required packages
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            sudo mkdir -p "$SDK_ROOT"
            sudo chown -R "$USER:$USER" "$SDK_ROOT"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "setup-android did not provide sdkmanager; downloading verified official Android SDK command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            TMP_DIR="$(mktemp -d)"
            CMDLINE_VERSION="15859902"
            CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            EXPECTED_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
            curl -sSL "$CMDLINE_URL" -o "$TMP_DIR/cmdline-tools.zip"
            echo "${EXPECTED_SHA256}  $TMP_DIR/cmdline-tools.zip" | sha256sum -c -
            unzip -q -o "$TMP_DIR/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$TMP_DIR"
            if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            fi
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager already available from setup-android at: $SDKMANAGER"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools are missing"
            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --version
          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Validate Android SDK installation
        run: |
          sdkmanager --version
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
